{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-badge">🔐</span>
            <h2>Welcome Back</h2>
            <p>Sign in to your JobPortal account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-group">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit-auth">
                <span>Sign In</span>
                <span>→</span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
